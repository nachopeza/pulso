# Cada 5 minutos avisa a la web para que publique en Bluesky las piezas aprobadas
# a las que ya les ha llegado la hora. La web decide qué sale; aquí solo se da el aviso.
# (GitHub puede retrasar unos minutos los workflows programados: es normal.)
name: Redes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  bluesky:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publicar lo que toca
        env:
          # REDES_KEY: clave propia del aviso (la misma que el secreto REDES_KEY de Cloudflare).
          # Si no está, prueba con PULSO_AGENTE_KEY (la de los agentes).
          CLAVE: ${{ secrets.REDES_KEY || secrets.PULSO_AGENTE_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::warning::Falta el secreto REDES_KEY en GitHub: no se publica nada"
            exit 0
          fi
          curl -sS --fail-with-body --max-time 60 -X POST \
            -H "Authorization: Bearer $CLAVE" \
            https://pulso.com.es/api/agente/redes
